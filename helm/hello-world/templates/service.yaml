apiVersion: v1
kind: Service
metadata:
  name: hello-world
spec:
  type: {{ .Values.service.type }}
  selector:
    app: hello-world
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 3000
{{- if .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
{{- end }}